name: Bug report
description: Report a problem or unexpected behavior in Cipher
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in Cipher.

        Please provide enough detail to help reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What steps cause the issue?
      placeholder: |
        1. Open...
        2. Tap...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Cipher is affected?
      options:
        - Mobile app
        - Backend API
        - Database
        - Networking
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: What device or environment are you using?
      placeholder: "Example: iPhone 15, iOS 18 / Windows 11"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors
      description: Paste any relevant error messages or logs here.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add anything else that may help explain the issue.
    validations:
      required: false
